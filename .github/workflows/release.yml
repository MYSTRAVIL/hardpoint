# Every push to main runs the release gates. A v* tag runs them too and then publishes the tarball
# they tested to npm through trusted publishing (OIDC), so no npm token is stored anywhere.
# npm's trusted publisher for @mystravil/hardpoint names this file: renaming it breaks publishing.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run audit -- --serve
      - run: npm run build
      - run: npm run consumer
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: consumer/*.tgz
          if-no-files-found: error

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later; pin the release npm instead of the runner's.
      - run: npm install -g npm@11.21.2
      - uses: actions/download-artifact@v8
        with:
          name: package
      # The ./ prefix keeps npm from reading the path as a GitHub shorthand.
      - run: npm publish ./*.tgz --access public
