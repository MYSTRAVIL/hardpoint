<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#000000" />
		<!--
			Theme, before first paint. The key and the colour pair are repeated in
			src/routes/theme.ts (this script cannot import it); change both together.
			Dark when the key is missing or invalid; 'system' follows the device, and
			the listener keeps the meta in step for as long as the page lives.
		-->
		<script>
			(function () {
				var KEY = 'hardpoint:theme';
				var DARK = '#000000';
				var LIGHT = '#f7f5f0';
				var root = document.documentElement;
				var meta = document.querySelector('meta[name="theme-color"]');
				var query = matchMedia('(prefers-color-scheme: light)');
				var theme = 'dark';
				try {
					var saved = localStorage.getItem(KEY);
					if (saved === 'light' || saved === 'system') theme = saved;
				} catch (e) {}
				function paint() {
					var t = root.dataset.theme;
					if (meta) meta.setAttribute('content', t === 'light' || (t === 'system' && query.matches) ? LIGHT : DARK);
				}
				root.dataset.theme = theme;
				paint();
				query.addEventListener('change', paint);
			})();
		</script>
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
